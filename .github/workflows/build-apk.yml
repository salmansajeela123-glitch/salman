name: Build MindAndBody APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 36.1 & Accept Licenses
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platforms;android-36.1" "build-tools;36.0.0" || true

      - name: Prepare Debug Keystore & Env
        run: |
          touch .env
          if [ -f debug.keystore.base64 ]; then
            base64 -d debug.keystore.base64 > debug.keystore
          else
            keytool -genkeypair -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Setup Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Build Signed APK
        run: |
          gradle assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk MindAndBody.apk

      - name: Upload MindAndBody.apk Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MindAndBody-APK
          path: MindAndBody.apk

      - name: Publish MindAndBody.apk to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0-latest
          name: Mind & Body Android APK (Latest)
          files: MindAndBody.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
